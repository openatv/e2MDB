name: buildbot

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v7
        with:
          ref: 'main'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build python CI
        run: |
          sudo apt-get -q update
          sudo apt-get install dos2unix
          pip install --upgrade pip autopep8
          ./CI/build.sh
